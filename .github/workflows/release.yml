name: Package and publish addon

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and zip
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 zip
      - name: Verify addon
        run: sh scripts/verify.sh
      - name: Package and release all supported clients
        uses: BigWigsMods/packager@v2
